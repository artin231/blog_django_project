{% extends 'base.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'style.css' %}">
{% endblock %}

{% block main %}

{% include 'blog/include/header.html'%}
<div class="container">
    <div class="blog_place">
        {% for i in a%}
        <div class="box" onclick="location.href = '{{ i.id }}'">
            <img src="{% static i.img_url %}" alt="">
            <h1>{{i.title}}</h1>
            
        </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
