{% extends 'base.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'style.css' %}">
{% endblock %}

{% block main %}

{% include 'blog/include/header.html'%}
<div class="container">
    <div class="blog_place">
        {% for i in a%}

        <div class="box" onclick="location.href = '{{ i.name_link }}'">
            <img src="{% static 'img/Logo_ligne_B_Narbonne.png' %}" alt="">
            <h1>{{ i.title }}</h1>
            <p>{{ i.short_des }}</p>

        </div>
        {% endfor %}
    </div>

</div>
{% endblock %}
